blueprint:
  name: Ultimate IKEA Bilresa Dual Blueprint - Dimming, Tripple Click, Both Button Click
  description: |-
    Two buttons. A whole room of possibilities. Dimming, single, double and triple
    clicks, both-button clicks and holds, multiple remotes and multi-step actions
    for your IKEA BILRESA dual-button Matter remote.

    **Eleven gesture assignments**

    - Button 1 and Button 2: single click, double click, triple click and hold each.
    - Both buttons on the same remote: short press, hold and triple click.
    - Every assignment accepts multiple Home Assistant actions in order: lights,
      plugs, covers, scenes, scripts and more. Use Add action to extend a sequence;
      an empty list does nothing. No personal devices or actions are preassigned.
    - Recognized combined gestures select the combined sequence instead of the
      individual sequences. Different remotes are never combined. There is no
      separate both-button double-click assignment.

    **Custom holds or built-in light dimming**

    - Custom actions: freely assign both single-button holds; no controlled light
      or other target device is required by the blueprint.
    - Light dimming: hold Button 1 to brighten and Button 2 to dim one selected
      light. Adjust the full ramp (1-10 s, default 3 s), release-event latency
      compensation (0-1 s, default 0.06 s) and release transition (0-2 s, default
      0.2 s). Release stops the ramp at an estimated brightness.
    - Dimming reserves both single-button holds; their custom action lists remain
      visible but are ignored. All clicks and both-button gestures stay configurable.

    **Add remotes and fine-tune recognition**

    - Start with Remote 1: edit its name and choose its two native button event
      entities. Use Add in the Add remote list for more remotes. All remotes in
      this automation share the assignments and future edits. Separate automations
      can keep different assignments while using the same installed blueprint logic.
    - Incomplete entries are ignored. Duplicate entity selections disable gesture
      handling until corrected. The native Add control follows Home Assistant's language.
    - Recognition window / cooldown: 100-1500 ms in 10 ms steps, default 250 ms.
      Lower values respond faster; higher values allow more combination tolerance.
      Matching uses Home Assistant event arrival, not the remote's internal click
      timeout. Hardware reporting can add delay; double-click actions wait for the window.

    **Optional rapid triple-click companion**

    Native multi_press_3 is supported when supplied; the legacy double-then-single
    fallback depends on integration events. On BILRESA firmware 1.9.15, install the
    OSAZEE BILRESA companion and enable Raw triple-click bridge for rapid clicks.
    Its aborted-multipress signal means AT LEAST THREE quick presses, not exactly
    three: four or more clicks may run the same action. Both-button triple matching
    requires both completions from the same remote within the recognition window.

    The local event-driven companion uses the existing Matter client and discovers
    eligible native entities: no re-pairing, extra host, credentials, manual node IDs,
    separate Matter connection or Core/server patch. Only selected remotes run this
    automation. It reconciles replaced clients after reload, with a 30-second local
    reference watchdog (not device polling), current registry lookup and diagnostics
    containing the emitted-event counter and last source event.

    **Defensive gesture handling**

    Restored, unknown, unavailable and non-advancing native event states are rejected.
    Pending detection is discarded on reload/restart. The companion rejects duplicate
    event numbers and stale/incomplete sequences; diagnostic history only establishes
    replay protection and never dispatches gestures. Startup-time raw events do not
    emit gestures. One recognized gesture selects one sequence; single mode prevents
    overlapping runs and ignores new gestures while the sequence or dimming run is
    active. Other automations listening to the remote can still conflict.

    **Sharing, requirements and beta status**

    English inputs and documentation. Author OSAZEE. MIT license. Direct blueprint
    import, optional HACS custom-repository/manual companion installation, examples,
    diagnostics and 24 detector regression tests with CI/HACS validation. Re-import
    the blueprint for logic updates; HACS companion updates do not update it.

    Requires Home Assistant Core 2026.8.0+, a dual-button BILRESA paired through
    Matter and two enabled native button event entities. The companion does not
    support scroll-wheel BILRESA, ZHA or Zigbee2MQTT. Rapid triple recognition is
    experimental; broader physical testing is needed and future Core/firmware
    compatibility is not guaranteed. Cover movement/stop can be configured as
    actions; daily brightness schedules belong in separate automations.
  domain: automation
  author: OSAZEE
  source_url: https://github.com/odggg/osazee-bilresa/blob/main/blueprints/automation/OSAZEE/ikea_bilresa_dual_button.yaml
  homeassistant:
    min_version: 2026.8.0
  input:
    usage:
      name: Usage
      icon: mdi:tune
      input:
        hold_mode:
          name: Single-button hold behavior
          description: Select Custom actions for freely assigned long presses, or
            Light dimming to reserve both single-button holds for brightness control.
            Click and both-button actions are unaffected.
          default: custom
          selector:
            select:
              mode: dropdown
              options:
              - value: custom
                label: Custom actions
              - value: dim
                label: Light dimming
              custom_value: false
              multiple: false
              sort: false
        raw_triple_enabled:
          name: Raw triple-click bridge
          description: Requires the OSAZEE BILRESA companion integration. On firmware
            1.9.15, three or more rapid clicks produce an aborted multipress instead
            of multi_press_3. Enable this to use that live-only signal. Four or more
            clicks may execute the same triple-click action.
          default: false
          selector:
            boolean: {}
    remotes:
      name: Remotes
      description: One remote entry is provided by default. Edit it to select its
        two button event entities. Add more entries below; every remote uses the same
        actions.
      icon: mdi:remote
      input:
        remote_list:
          name: Add remote
          description: Edit Remote 1 first, then use Add to add another remote. The
            native Add button follows your Home Assistant language. Select distinct
            event entities for each button and remote. Incomplete entries are ignored;
            duplicate entities disable gesture handling until corrected.
          default:
          - name: Remote 1
          selector:
            object:
              multiple: true
              label_field: name
              fields:
                name:
                  label: Remote name
                  required: true
                  selector:
                    text:
                      multiple: false
                      multiline: false
                button_1:
                  label: Button 1
                  required: true
                  selector:
                    entity:
                      filter:
                      - domain:
                        - event
                      reorder: false
                      multiple: false
                button_2:
                  label: Button 2
                  required: true
                  selector:
                    entity:
                      filter:
                      - domain:
                        - event
                      reorder: false
                      multiple: false
    dimming:
      name: Dimming settings (Light dimming only)
      description: Used only when Single-button hold behavior is Light dimming. Select
        a dimmable light in that mode. Leave this section empty when using Custom
        actions.
      icon: mdi:brightness-6
      collapsed: true
      input:
        light_entity:
          name: Light to dim
          description: Optional in Custom actions mode; required to use Light dimming.
            This selection does not assign any click actions.
          default: []
          selector:
            entity:
              filter:
              - domain:
                - light
              reorder: false
              multiple: false
        brightness_ramp_seconds:
          name: Full brightness ramp time
          description: Time to dim from minimum to maximum brightness.
          default: 3
          selector:
            number:
              min: 1.0
              max: 10.0
              step: 0.1
              unit_of_measurement: s
              mode: slider
        latency_compensation_seconds:
          name: Dimming latency compensation
          description: Compensates for the delay between button release and the release
            event.
          default: 0.06
          selector:
            number:
              min: 0.0
              max: 1.0
              step: 0.01
              unit_of_measurement: s
              mode: slider
        release_transition_seconds:
          name: Release transition
          description: Transition used when stopping at the estimated brightness on
            release.
          default: 0.2
          selector:
            number:
              min: 0.0
              max: 2.0
              step: 0.05
              unit_of_measurement: s
              mode: slider
    gesture_actions:
      name: Gesture actions
      description: Each field accepts multiple actions, executed in order. Leave a
        field empty to do nothing. The two single-button hold fields are used only
        in Custom actions mode.
      icon: mdi:gesture-tap-button
      input:
        single_button_1_action:
          name: Button 1 - Single click
          description: Add any actions to run on a single click of button 1.
          default: []
          selector:
            action: {}
        single_button_2_action:
          name: Button 2 - Single click
          description: Add any actions to run on a single click of button 2.
          default: []
          selector:
            action: {}
        double_button_1_action:
          name: Button 1 - Double click
          description: Add any actions to run on a double click of button 1.
          default: []
          selector:
            action: {}
        double_button_2_action:
          name: Button 2 - Double click
          description: Add any actions to run on a double click of button 2.
          default: []
          selector:
            action: {}
        hold_button_1_action:
          name: Button 1 - Hold (Custom actions only)
          description: IGNORED in Light dimming mode. Add any actions to run on a
            single-button hold in Custom actions mode.
          default: []
          selector:
            action: {}
        hold_button_2_action:
          name: Button 2 - Hold (Custom actions only)
          description: IGNORED in Light dimming mode. Add any actions to run on a
            single-button hold in Custom actions mode.
          default: []
          selector:
            action: {}
        short_both_action:
          name: Both buttons - Short press
          description: Add any actions to run when both buttons on the same remote
            are pressed within the recognition window.
          default: []
          selector:
            action: {}
        long_both_action:
          name: Both buttons - Hold
          description: Add any actions to run when both buttons on the same remote
            are held within the recognition window. Works in both hold modes.
          default: []
          selector:
            action: {}
        triple_button_1_action:
          name: Button 1 - Triple click
          description: Add any actions to run on a recognized triple click of button
            1.
          default: []
          selector:
            action: {}
        triple_button_2_action:
          name: Button 2 - Triple click
          description: Add any actions to run on a recognized triple click of button
            2.
          default: []
          selector:
            action: {}
        triple_both_action:
          name: Both buttons - Triple click
          description: Add any actions to run when a triple click of both buttons
            on the same remote is recognized.
          default: []
          selector:
            action: {}
    timing:
      name: Gesture timing
      icon: mdi:timer-cog-outline
      collapsed: true
      input:
        cooldown_ms:
          name: Recognition window / cooldown
          description: Maximum delay between related events. Lower values respond
            faster; higher values allow slower combined presses and software triple
            clicks. Double-click actions wait for this window to expire before executing.
          default: 250
          selector:
            number:
              min: 100.0
              max: 1500.0
              step: 10.0
              unit_of_measurement: ms
              mode: slider
mode: single
max_exceeded: silent
variables:
  remote_list: !input remote_list
  configured_remotes: '{{ remote_list | selectattr(''button_1'', ''defined'') | selectattr(''button_2'',
    ''defined'') | selectattr(''button_1'', ''match'', ''^event\\.'') | selectattr(''button_2'',
    ''match'', ''^event\\.'') | list }}'
  remote_entity_ids: '{{ (configured_remotes | map(attribute=''button_1'') | list)
    + (configured_remotes | map(attribute=''button_2'') | list) }}'
  hold_mode: !input hold_mode
  light_entity: !input light_entity
  scaled_ramp_time: !input brightness_ramp_seconds
  latency_compensation_offset: !input latency_compensation_seconds
  release_transition: !input release_transition_seconds
  cooldown_ms: !input cooldown_ms
  raw_triple_enabled: !input raw_triple_enabled
triggers:
- trigger: event
  event_type: state_changed
  id: remote_event
- trigger: event
  event_type: osazee_bilresa_multipress_aborted
  id: raw_triple
  enabled: !input raw_triple_enabled
conditions:
- condition: trigger
  id:
  - remote_event
  - raw_triple
- condition: template
  value_template: '{{ trigger.event.data.entity_id in remote_entity_ids and remote_entity_ids
    | count == remote_entity_ids | unique | list | count }}'
- condition: or
  conditions:
  - condition: and
    conditions:
    - condition: trigger
      id: remote_event
    - condition: template
      value_template: "{% set old = trigger.event.data.old_state %}\n{% set new =
        trigger.event.data.new_state %}\n{{ old is not none and new is not none\n
        \  and old.state not in ['unknown', 'unavailable']\n   and new.state not in
        ['unknown', 'unavailable']\n   and not old.attributes.get('restored', false)\n
        \  and not new.attributes.get('restored', false)\n   and as_timestamp(new.state,
        0) > as_timestamp(old.state, 0)\n   and new.attributes.get('event_type') in
        ['multi_press_1', 'multi_press_2', 'multi_press_3', 'long_press'] }}"
  - condition: and
    conditions:
    - condition: trigger
      id: raw_triple
    - condition: template
      value_template: '{{ raw_triple_enabled and trigger.event.data.get(''event_type'')
        == ''multi_press_aborted'' and trigger.event.data.get(''presses_at_least'',
        0) == 3 }}'
actions:
- variables:
    source_entity: '{{ trigger.event.data.entity_id }}'
    active_remote: '{{ ((configured_remotes | selectattr(''button_1'', ''eq'', source_entity)
      | list) + (configured_remotes | selectattr(''button_2'', ''eq'', source_entity)
      | list)) | first }}'
    button_1_entity: '{{ active_remote.button_1 }}'
    button_2_entity: '{{ active_remote.button_2 }}'
    gesture: '{{ (''native_triple'' if trigger.id == ''raw_triple'' else {''multi_press_1'':
      ''single'', ''multi_press_2'': ''double'', ''multi_press_3'': ''native_triple'',
      ''long_press'': ''hold''}[trigger.event.data.new_state.attributes.event_type])
      ~ (''_up'' if source_entity == button_1_entity else ''_down'') }}'
- choose:
  - conditions:
    - condition: template
      value_template: '{{ gesture == ''single_up'' }}'
    sequence:
    - alias: Start a bounded wait for a matching event from this remote
      variables:
        gesture_wait_completed: false
        gesture_wait_id: ''
        gesture_wait_deadline: '{{ as_timestamp(now()) + (cooldown_ms / 1000) }}'
    - repeat:
        while:
        - condition: template
          value_template: '{{ not gesture_wait_completed and as_timestamp(now()) <
            gesture_wait_deadline }}'
        sequence:
        - wait_for_trigger:
          - trigger: event
            event_type: state_changed
            event_data:
              entity_id: '{{ button_2_entity }}'
            id: '0'
          timeout:
            seconds: '{{ [gesture_wait_deadline - as_timestamp(now()), 0] | max }}'
          continue_on_timeout: true
        - if:
          - condition: template
            value_template: "{% if wait.completed %}\n  {% set old = wait.trigger.event.data.old_state
              %}\n  {% set new = wait.trigger.event.data.new_state %}\n  {{ old is
              not none and new is not none\n     and old.state not in ['unknown',
              'unavailable']\n     and new.state not in ['unknown', 'unavailable']\n
              \    and not old.attributes.get('restored', false)\n     and not new.attributes.get('restored',
              false)\n     and as_timestamp(new.state, 0) > as_timestamp(old.state,
              0)\n     and ((wait.trigger.id == '0' and new.attributes.get('event_type')
              == 'multi_press_1')) }}\n{% else %}false{% endif %}"
          then:
          - variables:
              gesture_wait_completed: true
              gesture_wait_id: '{{ wait.trigger.id }}'
    - if:
      - condition: template
        value_template: '{{ gesture_wait_completed }}'
      then:
      - sequence: !input short_both_action
      - stop: Combined short press handled once.
    - sequence: !input single_button_1_action
  - conditions:
    - condition: template
      value_template: '{{ gesture == ''single_down'' }}'
    sequence:
    - alias: Start a bounded wait for a matching event from this remote
      variables:
        gesture_wait_completed: false
        gesture_wait_id: ''
        gesture_wait_deadline: '{{ as_timestamp(now()) + (cooldown_ms / 1000) }}'
    - repeat:
        while:
        - condition: template
          value_template: '{{ not gesture_wait_completed and as_timestamp(now()) <
            gesture_wait_deadline }}'
        sequence:
        - wait_for_trigger:
          - trigger: event
            event_type: state_changed
            event_data:
              entity_id: '{{ button_1_entity }}'
            id: '0'
          timeout:
            seconds: '{{ [gesture_wait_deadline - as_timestamp(now()), 0] | max }}'
          continue_on_timeout: true
        - if:
          - condition: template
            value_template: "{% if wait.completed %}\n  {% set old = wait.trigger.event.data.old_state
              %}\n  {% set new = wait.trigger.event.data.new_state %}\n  {{ old is
              not none and new is not none\n     and old.state not in ['unknown',
              'unavailable']\n     and new.state not in ['unknown', 'unavailable']\n
              \    and not old.attributes.get('restored', false)\n     and not new.attributes.get('restored',
              false)\n     and as_timestamp(new.state, 0) > as_timestamp(old.state,
              0)\n     and ((wait.trigger.id == '0' and new.attributes.get('event_type')
              == 'multi_press_1')) }}\n{% else %}false{% endif %}"
          then:
          - variables:
              gesture_wait_completed: true
              gesture_wait_id: '{{ wait.trigger.id }}'
    - if:
      - condition: template
        value_template: '{{ gesture_wait_completed }}'
      then:
      - sequence: !input short_both_action
      - stop: Combined short press handled once.
    - sequence: !input single_button_2_action
  - conditions:
    - condition: template
      value_template: '{{ gesture == ''double_up'' }}'
    sequence:
    - alias: Start a bounded wait for a matching event from this remote
      variables:
        gesture_wait_completed: false
        gesture_wait_id: ''
        gesture_wait_deadline: '{{ as_timestamp(now()) + (cooldown_ms / 1000) }}'
    - repeat:
        while:
        - condition: template
          value_template: '{{ not gesture_wait_completed and as_timestamp(now()) <
            gesture_wait_deadline }}'
        sequence:
        - wait_for_trigger:
          - trigger: event
            event_type: state_changed
            event_data:
              entity_id: '{{ button_1_entity }}'
            id: same_third
          - trigger: event
            event_type: state_changed
            event_data:
              entity_id: '{{ button_2_entity }}'
            id: opposite_double
          timeout:
            seconds: '{{ [gesture_wait_deadline - as_timestamp(now()), 0] | max }}'
          continue_on_timeout: true
        - if:
          - condition: template
            value_template: "{% if wait.completed %}\n  {% set old = wait.trigger.event.data.old_state
              %}\n  {% set new = wait.trigger.event.data.new_state %}\n  {{ old is
              not none and new is not none\n     and old.state not in ['unknown',
              'unavailable']\n     and new.state not in ['unknown', 'unavailable']\n
              \    and not old.attributes.get('restored', false)\n     and not new.attributes.get('restored',
              false)\n     and as_timestamp(new.state, 0) > as_timestamp(old.state,
              0)\n     and ((wait.trigger.id == 'same_third' and new.attributes.get('event_type')
              == 'multi_press_1') or (wait.trigger.id == 'opposite_double' and new.attributes.get('event_type')
              == 'multi_press_2')) }}\n{% else %}false{% endif %}"
          then:
          - variables:
              gesture_wait_completed: true
              gesture_wait_id: '{{ wait.trigger.id }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ gesture_wait_completed and gesture_wait_id == ''same_third''
            }}'
        sequence:
        - sequence: !input triple_button_1_action
        - stop: Button 1 triple click handled once.
      - conditions:
        - condition: template
          value_template: '{{ gesture_wait_completed and gesture_wait_id == ''opposite_double''
            }}'
        sequence:
        - alias: Start a bounded wait for a matching event from this remote
          variables:
            gesture_wait_completed: false
            gesture_wait_id: ''
            gesture_wait_deadline: '{{ as_timestamp(now()) + (cooldown_ms / 1000)
              }}'
        - repeat:
            while:
            - condition: template
              value_template: '{{ not gesture_wait_completed and as_timestamp(now())
                < gesture_wait_deadline }}'
            sequence:
            - wait_for_trigger:
              - trigger: event
                event_type: state_changed
                event_data:
                  entity_id: '{{ button_1_entity }}'
                id: third_up
              - trigger: event
                event_type: state_changed
                event_data:
                  entity_id: '{{ button_2_entity }}'
                id: third_down
              timeout:
                seconds: '{{ [gesture_wait_deadline - as_timestamp(now()), 0] | max
                  }}'
              continue_on_timeout: true
            - if:
              - condition: template
                value_template: "{% if wait.completed %}\n  {% set old = wait.trigger.event.data.old_state
                  %}\n  {% set new = wait.trigger.event.data.new_state %}\n  {{ old
                  is not none and new is not none\n     and old.state not in ['unknown',
                  'unavailable']\n     and new.state not in ['unknown', 'unavailable']\n
                  \    and not old.attributes.get('restored', false)\n     and not
                  new.attributes.get('restored', false)\n     and as_timestamp(new.state,
                  0) > as_timestamp(old.state, 0)\n     and ((wait.trigger.id == 'third_up'
                  and new.attributes.get('event_type') == 'multi_press_1') or (wait.trigger.id
                  == 'third_down' and new.attributes.get('event_type') == 'multi_press_1'))
                  }}\n{% else %}false{% endif %}"
              then:
              - variables:
                  gesture_wait_completed: true
                  gesture_wait_id: '{{ wait.trigger.id }}'
        - if:
          - condition: template
            value_template: '{{ gesture_wait_completed }}'
          then:
          - variables:
              first_third: '{{ gesture_wait_id }}'
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ first_third == ''third_up'' }}'
              sequence:
              - alias: Start a bounded wait for a matching event from this remote
                variables:
                  gesture_wait_completed: false
                  gesture_wait_id: ''
                  gesture_wait_deadline: '{{ as_timestamp(now()) + (cooldown_ms /
                    1000) }}'
              - repeat:
                  while:
                  - condition: template
                    value_template: '{{ not gesture_wait_completed and as_timestamp(now())
                      < gesture_wait_deadline }}'
                  sequence:
                  - wait_for_trigger:
                    - trigger: event
                      event_type: state_changed
                      event_data:
                        entity_id: '{{ button_2_entity }}'
                      id: '0'
                    timeout:
                      seconds: '{{ [gesture_wait_deadline - as_timestamp(now()), 0]
                        | max }}'
                    continue_on_timeout: true
                  - if:
                    - condition: template
                      value_template: "{% if wait.completed %}\n  {% set old = wait.trigger.event.data.old_state
                        %}\n  {% set new = wait.trigger.event.data.new_state %}\n
                        \ {{ old is not none and new is not none\n     and old.state
                        not in ['unknown', 'unavailable']\n     and new.state not
                        in ['unknown', 'unavailable']\n     and not old.attributes.get('restored',
                        false)\n     and not new.attributes.get('restored', false)\n
                        \    and as_timestamp(new.state, 0) > as_timestamp(old.state,
                        0)\n     and ((wait.trigger.id == '0' and new.attributes.get('event_type')
                        == 'multi_press_1')) }}\n{% else %}false{% endif %}"
                    then:
                    - variables:
                        gesture_wait_completed: true
                        gesture_wait_id: '{{ wait.trigger.id }}'
            - conditions:
              - condition: template
                value_template: '{{ first_third == ''third_down'' }}'
              sequence:
              - alias: Start a bounded wait for a matching event from this remote
                variables:
                  gesture_wait_completed: false
                  gesture_wait_id: ''
                  gesture_wait_deadline: '{{ as_timestamp(now()) + (cooldown_ms /
                    1000) }}'
              - repeat:
                  while:
                  - condition: template
                    value_template: '{{ not gesture_wait_completed and as_timestamp(now())
                      < gesture_wait_deadline }}'
                  sequence:
                  - wait_for_trigger:
                    - trigger: event
                      event_type: state_changed
                      event_data:
                        entity_id: '{{ button_1_entity }}'
                      id: '0'
                    timeout:
                      seconds: '{{ [gesture_wait_deadline - as_timestamp(now()), 0]
                        | max }}'
                    continue_on_timeout: true
                  - if:
                    - condition: template
                      value_template: "{% if wait.completed %}\n  {% set old = wait.trigger.event.data.old_state
                        %}\n  {% set new = wait.trigger.event.data.new_state %}\n
                        \ {{ old is not none and new is not none\n     and old.state
                        not in ['unknown', 'unavailable']\n     and new.state not
                        in ['unknown', 'unavailable']\n     and not old.attributes.get('restored',
                        false)\n     and not new.attributes.get('restored', false)\n
                        \    and as_timestamp(new.state, 0) > as_timestamp(old.state,
                        0)\n     and ((wait.trigger.id == '0' and new.attributes.get('event_type')
                        == 'multi_press_1')) }}\n{% else %}false{% endif %}"
                    then:
                    - variables:
                        gesture_wait_completed: true
                        gesture_wait_id: '{{ wait.trigger.id }}'
          - if:
            - condition: template
              value_template: '{{ gesture_wait_completed }}'
            then:
